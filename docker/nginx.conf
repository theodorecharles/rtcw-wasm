server {
    listen 8088;
    server_name _;
    root /usr/share/nginx/html;

    location = /health {
        default_type application/json;
        add_header Cache-Control no-store;
        return 200 '{"ok":true,"game":"rtcw-wasm","status":"diagnostic-only"}';
    }

    location = /data {
        return 404;
    }

    location /data/ {
        return 404;
    }
}
